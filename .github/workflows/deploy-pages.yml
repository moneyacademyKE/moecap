name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      # The SEO/artifact assertions read generated files (robots.txt, sitemap.xml,
      # 404.html, og.png, trust pages), so the build has to run before the tests.
      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Build & deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
