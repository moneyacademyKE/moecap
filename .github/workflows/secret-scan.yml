# Secret-leak guard — runs on every push and PR.
#
# Scans the FULL commit history (fetch-depth: 0) plus the working tree for
# known secret formats (API keys, tokens, private keys) using gitleaks.
# Any hit fails the build BEFORE deploy, so a leaked key can never reach
# a deployed artifact or a public branch unnoticed.
#
# Known-good non-secrets (test fixtures etc.) get allowlisted in .gitleaks.toml.

name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
